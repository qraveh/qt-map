name: build
on:
  push: { branches: [main] }
  pull_request:
  release: { types: [published] }
# read-only by default: the build installs and runs third-party packages; only the job that attaches the Release asset writes
# (30 Sep 2026: with no write permission at all, the 2026.09 Release got its zip by hand)
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: python3 build/build.py
      - name: check the build is committed and reproduces byte-for-byte
        run: |
          git diff --exit-code -- data/graph.json report/ README.md CHANGELOG.md .zenodo.json dist/ || (echo "run build/build.py and commit the result; if only dist/ differs, the build is not reproducible on this platform" && exit 1)
          test -z "$(git status --porcelain --ignored=no dist/)" || (echo "untracked files in dist/ — commit or ignore them" && git status --porcelain dist/ && exit 1)
      - name: consistency checks
        run: |
          python3 build/audit/edges_check.py
          python3 build/audit/links_check.py
          python3 build/audit/links_check.py --records
          python3 build/audit/briefs_meta_check.py --quiet
          python3 build/audit/records_check.py
          python3 build/audit/text_lint.py
          python3 build/audit/propagate.py --check   # the change ledgers against the hand-written corners (30 Sep 2026)
          python3 build/brief_refs.py --check
          python3 build/media.py --check
      - name: package the site
        # the deployable tree: the three main pages (also as index.html), the language fragments, the assets, every record page, the
        # sitemap and the list of pictures the deploy copies from the media register (build/DEPLOY.md); body.html never enters dist/.
        # Byte-reproducible (the editor's word of 30 Sep 2026): the Release asset and the Zenodo file are the same bytes
        run: python3 build/site_zip.py
      - uses: actions/upload-artifact@v4
        with: { name: quantum-technology-atlas, path: quantum-technology-atlas-site.zip }
  attach:
    # the Release asset — the build job's zip; this job alone may write to the repository
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: quantum-technology-atlas }
      - uses: softprops/action-gh-release@v2
        with: { files: quantum-technology-atlas-site.zip }   # the whole site; the same bytes go to the Zenodo record
